# Azurite + TeamsMeetingRecorder with Azure Blob storage (Summarly-compatible).
# Usage:
#   docker compose -f azurite.compose.yaml up -d
#
# Azurite blob API: http://localhost:410000
# Bot API: http://localhost:8000

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: teams-azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
    ports:
      - "410000:10000"
    volumes:
      - azurite-data:/data
    networks:
      - teams-recorder

  teams-meeting-recorder:
    build: .
    container_name: teams-meeting-recorder
    ports:
      - "8000:8000"
    environment:
      STORAGE_BACKEND: azure
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      AZURE_STORAGE_CONTAINER: meeting-recordings
      AZURE_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:410000/devstoreaccount1
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    shm_size: 2gb
    depends_on:
      - azurite
    networks:
      - teams-recorder

networks:
  teams-recorder:
    driver: bridge

volumes:
  azurite-data:
